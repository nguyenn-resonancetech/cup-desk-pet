name: Build & release

# Push a tag like v0.3.0 → builds Windows + macOS and publishes them on the GitHub Release page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # no paid signing certs; mac is ad-hoc signed in build/afterPack.cjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: cup-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            **Tải Cúp về máy:**
            - **Windows:** `Cup-Desk-Pet-Setup-…-win-x64.exe` (bản cài) hoặc `Cup-Desk-Pet-Portable-…-win-x64.exe` (chạy luôn, không cần cài). Windows SmartScreen báo "unrecognized app" → bấm *More info → Run anyway*.
            - **macOS chip Apple (M1/M2/M3/M4):** `Cup-Desk-Pet-…-mac-arm64.dmg`
            - **macOS chip Intel:** `Cup-Desk-Pet-…-mac-x64.dmg`
              Lần đầu mở: kéo Cúp vào Applications → chuột phải vào app → *Open* → *Open*. (App chưa ký Apple Developer nên macOS hỏi một lần.)
